<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیش‌نمایش کد موشن</title><style>body{margin:24px;background:#0b1120;color:#fff;font-family:Tahoma,Arial,sans-serif}main{max-width:1100px;margin:auto}#viewport{position:relative;overflow:hidden;width:min(100%,420px);margin:auto;aspect-ratio:9/16;background:#101827}#stage{position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden;font-family:Tahoma,Arial,sans-serif}button{margin:8px 0;padding:10px;font:inherit}input{width:100%}output{direction:ltr;display:inline-block}textarea{box-sizing:border-box;width:100%;height:300px;background:#131e30;color:#e2e8f0;border:1px solid #526078;padding:16px;font:13px/1.6 monospace;direction:ltr;text-align:left;resize:vertical}select{padding:10px;font:inherit}a{color:#86f0d2}button:disabled{opacity:.45}#render-status{white-space:pre-wrap;line-height:1.8}</style></head><body><main><h1>پیش‌نمایش کد موشن</h1><p><a href="/apps/studio/">بازگشت به استودیو</a> · کد باید قرارداد composition / createMotion را رعایت کند.</p>
<label for="example-select">نمونه</label><select id="example-select"><option value="original">نمونهٔ اولیه</option><option value="minimal">مینیمال</option><option value="product">محصول مدرن</option><option value="educational">آموزشی</option></select> <button id="load-example">بارگذاری نمونه</button>
<label for="code-input" style="display:block">کد موشن (JavaScript module)</label><textarea id="code-input" spellcheck="false" aria-label="کد موشن"></textarea>
<button id="apply-code">اجرای پیش‌نمایش کد</button> <button id="render-code">ساخت MP4 از همین کد</button><p id="render-status" role="status"></p><a id="video-link" hidden>دریافت MP4</a><div id="viewport"><div id="stage"></div></div><p id="status" role="status">در حال بارگذاری…</p><fieldset id="controls" disabled><button id="play">پخش</button> <button id="pause">مکث</button> <button id="restart">از ابتدا</button> <output id="time"></output><input id="seek" type="range" min="0" step="0.01" value="0" aria-label="زمان پیش‌نمایش"></fieldset></main><script src="/vendor/gsap.js"></script><script type="module" src="/apps/code-preview/main.js"></script></body></html>
